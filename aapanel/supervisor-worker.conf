# ==============================================================================
# Configuración Supervisor para Colas de PichoDescargas en aaPanel VPS
# En aaPanel: App Store > Supervisor > Add Daemon
# ==============================================================================

[program:pichodescargas-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/tudominio.com/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/tudominio.com/storage/logs/queue-worker.log
stopwaitsecs=3600
