# ==============================================================================
# Configuración Nginx Optimizada para PichoDescargas en aaPanel VPS
# Ubicación en aaPanel: Website > Settings > Config / Configuration
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # Directorio Raíz OBLIGATORIO: debe apuntar a la carpeta /public
    root /www/wwwroot/tudominio.com/public;
    index index.php index.html;

    # Certificados SSL (Generados por Let's Encrypt o Cloudflare en aaPanel)
    # ssl_certificate    /www/server/panel/vhost/cert/tudominio.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/tudominio.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    # ssl_prefer_server_ciphers on;

    # Tamaño máximo de subida (Permite carga de torrents, imágenes y archivos grandes)
    client_max_body_size 256M;
    client_body_buffer_size 128k;

    # Compresión Gzip para acelerar la carga en móvil y PC
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2 font/woff;

    # Cabeceras de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Regla de Reescritura de Rutas de Laravel (Pseudo-static en aaPanel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Caché Inmutable para Assets de Vite y Fuentes
    location ~* \.(?:css|js|woff2|woff|ttf|eot)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Caché para Imágenes y Medios
    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Procesamiento PHP-FPM 8.3 (aaPanel Socket)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts extendidos para scrapers y procesamiento de torrents
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Bloqueo estricto de archivos sensibles y ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueo de acceso directo a base de datos sqlite y logs
    location ~* \.(sqlite|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs del sitio
    access_log /www/wwwlogs/tudominio.com.log;
    error_log  /www/wwwlogs/tudominio.com.error.log;
}
